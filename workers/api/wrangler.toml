name = "kindraw-api"
main = "src/index.ts"
compatibility_date = "2025-11-01"

[observability]
enabled = true

[[d1_databases]]
binding = "KINDRAW_DB"
database_name = "kindraw-db"
database_id = "fbaecde8-8e18-4638-ad8f-2ea756225a61"

[[r2_buckets]]
binding = "KINDRAW_BLOBS"
bucket_name = "kindraw-blobs"

[[durable_objects.bindings]]
name = "KINDRAW_COLLAB"
class_name = "KindrawCollaborationRoom"

[vars]
KINDRAW_APP_ORIGIN = "https://kindraw.dev"
# Text-to-diagram uses the GLM Coding Plan (Z.ai, OpenAI-compatible). The API
# key is a secret: `wrangler secret put AI_TEXT_API_KEY`. Vision (diagram-to-code)
# stays on OpenRouter via the OPENROUTER_* secret.
AI_TEXT_BASE_URL = "https://api.z.ai/api/coding/paas/v4"
AI_TEXT_MODEL = "glm-4.7"

[[routes]]
pattern = "api.kindraw.dev"
custom_domain = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KindrawCollaborationRoom"]
